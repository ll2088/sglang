name: Self-improvement validation
run-name: "Self-improve · ${{ inputs.validation_id }}"

on:
  workflow_dispatch:
    inputs:
      validation_id:
        description: "autojump validation id"
        required: true
        type: string
      candidate_id:
        description: "Opportunity id"
        required: true
        type: string
      source_repo:
        description: "Upstream repository"
        required: true
        type: string
      source_pr:
        description: "Merged pull request number"
        required: true
        type: string
      adoption_ref:
        description: "Branch or ref containing the experiment (optional)"
        required: false
        default: ""
        type: string
      target_ref:
        description: "Fallback branch/ref to validate"
        required: false
        default: "main"
        type: string
      dimensions:
        description: "JSON array of dimensions for this run (key/label/command); falls back to .self-improvement.json"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: self-improvement-${{ inputs.validation_id }}
  cancel-in-progress: false

jobs:
  pick:
    name: dimensions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          DIMENSIONS_INPUT: ${{ inputs.dimensions }}
        run: |
          if [ -n "$DIMENSIONS_INPUT" ]; then
            echo "matrix=$DIMENSIONS_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"key":"effect"},{"key":"performance"},{"key":"stability"},{"key":"usability"}]' >> "$GITHUB_OUTPUT"
          fi

  validation:
    name: ${{ matrix.dimension.key }}
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dimension: ${{ fromJSON(needs.pick.outputs.matrix) }}
    steps:
      - name: Checkout experiment ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.adoption_ref || inputs.target_ref || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # The runner and its config come from the commit the workflow was
      # dispatched on (the default branch), so experiment branches created
      # before autojump was installed still validate correctly.
      - name: Checkout autojump runner
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .mergelens-runner
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/self-improvement
            .self-improvement.json
          sparse-checkout-cone-mode: false

      - name: Setup Node for the validation runner
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate ${{ matrix.dimension.key }}
        env:
          MERGELENS_VALIDATION_ID: ${{ inputs.validation_id }}
          MERGELENS_CANDIDATE_ID: ${{ inputs.candidate_id }}
          MERGELENS_SOURCE_REPO: ${{ inputs.source_repo }}
          MERGELENS_SOURCE_PR: ${{ inputs.source_pr }}
          MERGELENS_DIMENSION: ${{ matrix.dimension.key }}
          MERGELENS_DIMENSION_LABEL: ${{ matrix.dimension.label }}
          MERGELENS_DIMENSION_COMMAND: ${{ matrix.dimension.command }}
          MERGELENS_DIMENSION_RUNS: ${{ matrix.dimension.runs }}
          MERGELENS_DIMENSION_TIMEOUT: ${{ matrix.dimension.timeout_minutes }}
          MERGELENS_CONFIG: .mergelens-runner/.self-improvement.json
        run: node .mergelens-runner/.github/self-improvement/run-dimension.mjs "$MERGELENS_DIMENSION"
