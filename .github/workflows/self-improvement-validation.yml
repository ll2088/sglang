name: Self-improvement validation
run-name: "Self-improve · ${{ inputs.validation_id }}"

on:
  workflow_dispatch:
    inputs:
      validation_id:
        description: "MergeLens validation id"
        required: true
        type: string
      candidate_id:
        description: "Opportunity id"
        required: true
        type: string
      source_repo:
        description: "Upstream repository"
        required: true
        type: string
      source_pr:
        description: "Merged pull request number"
        required: true
        type: string
      adoption_ref:
        description: "Branch or ref containing the experiment (optional)"
        required: false
        default: ""
        type: string
      target_ref:
        description: "Fallback branch/ref to validate"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: self-improvement-${{ inputs.validation_id }}
  cancel-in-progress: false

jobs:
  validation:
    name: ${{ matrix.dimension }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dimension: [effect, performance, stability, usability]
    steps:
      - name: Checkout experiment ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.adoption_ref || inputs.target_ref || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # The runner and its config come from the commit the workflow was
      # dispatched on (the default branch), so experiment branches created
      # before MergeLens was installed still validate correctly.
      - name: Checkout MergeLens runner
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .mergelens-runner
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/self-improvement
            .self-improvement.json
          sparse-checkout-cone-mode: false

      - name: Setup Node for the validation runner
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate ${{ matrix.dimension }}
        env:
          MERGELENS_VALIDATION_ID: ${{ inputs.validation_id }}
          MERGELENS_CANDIDATE_ID: ${{ inputs.candidate_id }}
          MERGELENS_SOURCE_REPO: ${{ inputs.source_repo }}
          MERGELENS_SOURCE_PR: ${{ inputs.source_pr }}
          MERGELENS_DIMENSION: ${{ matrix.dimension }}
          MERGELENS_CONFIG: .mergelens-runner/.self-improvement.json
        run: node .mergelens-runner/.github/self-improvement/run-dimension.mjs "$MERGELENS_DIMENSION"
