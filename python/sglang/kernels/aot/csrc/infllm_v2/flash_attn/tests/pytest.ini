; Pytest configuration for the int64 accumulator tests.
;
; These tests are pure standard library and must run without installing the
; full sglang dependency set. Pinning rootdir/testpaths to this directory
; prevents pytest from walking up the tree, importing the sglang package and
; triggering a heavy dependency install during collection.
;
; Do not add third-party plugins or options that require extra packages here.

[pytest]
rootdir = .
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -p no:cacheprovider
norecursedirs = .* build dist node_modules
