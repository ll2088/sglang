[pytest]
asyncio_mode = auto

# Keep collection deterministic and independent of stale cache state so the
# config-consistency checks behave identically in clean CI environments.
addopts = -p no:cacheprovider -p no:randomly

# Keep collection scoped to the registered CI test tree so running `pytest`
# from the repo root resolves the same collection set as `test/run_suite.py`,
# which scans test/registered/**/*.py. Paths are resolved relative to this
# ini file's directory (test/), so the collection set is identical whether
# pytest is invoked from the repo root or from test/.
#
# Scoping to `registered` (not `.`) keeps helper scripts, conftest modules and
# the config-consistency test itself out of the CI suite collection, so the
# collected node-id set matches what run_suite.py actually dispatches.
# The consistency test is run explicitly by path, never via testpaths.
testpaths = registered

# Registered CI tests live under test/registered/ and are named test_*.py;
# benchmark files use bench_*.py and are executed by run_suite.py directly.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Declared so `pytest -q test` does not emit unknown-marker warnings.
markers =
    asyncio: mark a test as an asyncio coroutine test
    slow: mark a test as slow
    gpu: mark a test as requiring a GPU
    nightly: mark a test as nightly-only
    config: mark a test as validating repository/CI configuration

# Pin rootdir to the repository root (parent of this ini file) so that
# `pytest` invoked from the repo root and from test/ agree on rootdir and
# therefore on the collected node-id set. `..` is resolved relative to this
# ini file's directory, i.e. the repo root, in both invocation modes.
# Note: pytest itself does not read `rootdir` from an ini file; the value is
# kept here as the single source of truth for test_pytest_config_consistency
# and for callers that pass `--rootdir` explicitly.
rootdir = ..
