[pytest]
asyncio_mode = auto
markers =
    import_smoke: lightweight smoke tests for sglang top-level import chain

# The import smoke tests live in test/import_smoke.py and
# test/import_smoke_test.py and only depend on the standard library and
# pytest.  test/import_smoke.py bootstraps sys.path and installs lightweight
# stubs for heavy third-party deps (e.g. torch) before importing sglang, so
# they run even when the sglang distribution and its runtime dependencies are
# not installed.  Run them with:
#
#     python -m pytest -q test/import_smoke_test.py -k import_smoke
#     python -m pytest -q test/run_suite.py -k import_smoke
#
# or, in a bare environment (no pytest, no sglang runtime deps):
#
#     python test/import_smoke.py --bare
#     python test/import_smoke.py --selfcheck

# The import smoke tests live in test/import_smoke.py and only depend on the
# standard library and pytest.  test/conftest.py adds python/ to sys.path and
# installs lightweight stubs for heavy third-party deps (e.g. torch) before
# collection, so they run even when the sglang distribution and its runtime
# dependencies are not installed.  Run them with:
#
#     python -m pytest -q test/import_smoke.py -k import_smoke
#     python -m pytest -q test/run_suite.py -k import_smoke
#
# or, in a bare environment (no pytest, no sglang runtime deps):
#
#     python test/import_smoke.py --bare
