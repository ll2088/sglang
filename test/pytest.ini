[pytest]
asyncio_mode = auto
markers =
    import_smoke: lightweight smoke tests for sglang top-level import chain

# The import_smoke marker is registered here so the smoke tests can be run
# standalone with ``-k import_smoke`` without emitting
# PytestUnknownMarkWarning and without requiring the heavy sglang runtime
# dependency tree to be installed.  See test/import_smoke.py for the
# self-contained bootstrap.
#
# The smoke checks are also exposed as a setup-safe entry point that never
# imports pytest and never touches the network, so CI can run them *before*
# installing the heavy runtime dependency tree (and keep running them when
# that install fails):
#
#     python test/import_smoke.py --ci
#
# The pytest-based variants below remain the primary acceptance commands
# once pytest is installed.
#
# Run them with:
#
#     python -m pytest -q test/import_smoke_test.py -k import_smoke
#     python -m pytest -q test/run_suite.py -k import_smoke
#
# or, in a bare environment (no pytest, no sglang runtime deps):
#
#     python test/import_smoke.py --bare
#     python test/import_smoke.py --selfcheck
#     python test/import_smoke.py --negative
#
# The smoke tests never require the sglang distribution to be installed:
# they inject python/ onto sys.path and stub genuinely missing heavy
# dependencies, so a failed environment-preparation step cannot mask a real
# import regression.
