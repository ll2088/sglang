[pytest]
asyncio_mode = auto
markers =
    import_smoke: lightweight smoke tests for sglang top-level import chain

# The import_smoke marker is registered here so the smoke tests can be run
# standalone with ``-k import_smoke`` without emitting PytestUnknownMarkWarning
# and without requiring the heavy sglang runtime dependency tree to be
# installed.  See test/import_smoke.py for the self-contained bootstrap.

# The import smoke tests live in test/import_smoke.py and
# test/import_smoke_test.py and only depend on the standard library and
# pytest.  test/conftest.py adds python/ to sys.path and installs lightweight
# stubs for heavy third-party deps (e.g. torch) before collection, so they run
# even when the sglang distribution and its runtime dependencies are not
# installed.  Run them with:
#
#     python -m pytest -q test/import_smoke_test.py -k import_smoke
#     python -m pytest -q test/run_suite.py -k import_smoke
#
# or, in a bare environment (no pytest, no sglang runtime deps):
#
#     python test/import_smoke.py --bare
#     python test/import_smoke.py --selfcheck
#     python test/import_smoke.py --negative
#
# The smoke tests never require the sglang distribution to be installed.  CI
# environment preparation for the import-smoke dimensions must therefore not
# run a full ``pip install -e python``: resolving the heavy runtime dependency
# tree can fail before any test runs, which makes the smoke tests
# unobservable.  Install pytest with the smoke constraints instead, or install
# the distribution with ``--no-deps``:
#
#     pip install -c test/constraints-smoke.txt pytest
#     pip install --no-build-isolation --no-deps -e python
#
# If the CI environment-preparation step still runs ``pip install -e python``
# and fails while resolving the heavy runtime dependency tree, the smoke
# tests can be run directly against the source tree instead:
#
#     python test/import_smoke.py --bare
#     python test/import_smoke.py --selfcheck
#     python test/import_smoke.py --negative
#
# or with a minimal pytest environment:
#
#     pip install -c test/constraints-smoke.txt pytest
#     python -m pytest -q test/import_smoke_test.py -k import_smoke
#
# The smoke tests are self-contained: they inject python/ onto sys.path and
# stub genuinely missing heavy dependencies, so a failed environment
# preparation step cannot mask a real import regression.
