[pytest]
asyncio_mode = auto
markers =
    import_smoke: lightweight smoke tests for sglang top-level import chain

# The import smoke tests live in test/import_smoke_test.py and only depend on
# the standard library and pytest.  They add python/ to sys.path themselves and
# install minimal stubs for heavy third-party deps (e.g. torch) so they can run
# even when the sglang distribution and its runtime dependencies are not
# installed.  Run them with:
#
#     python -m pytest -q test/import_smoke_test.py -k import_smoke
#
# or, in a bare environment:
#
#     python test/import_smoke_test.py

