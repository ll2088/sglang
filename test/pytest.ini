[pytest]
# Scope collection to the stdlib-only Dockerfile permission checks and avoid
# loading repository-level plugins/options that would pull in sglang during
# environment setup. testpaths points at the single self-contained test file so
# the repository-root sglang package is never imported during setup;
# norecursedirs additionally skips build artifacts and vendored trees.
#
# CI must invoke this file explicitly with `-c test/pytest.ini` so the
# repository-root pytest configuration cannot override these settings and
# trigger a full sglang install during setup.
#
# `-p no:randomly` is intentionally not set here: the stability check passes it
# on the command line, and hard-coding it would hide ordering bugs from local
# runs that do not opt in.
testpaths = test_dockerfile_permissions.py
python_files = test_dockerfile_permissions.py
python_classes =
python_functions = test_*
# Keep addopts minimal: no third-party plugins, no cache provider, and no
# rootdir override that could pull in the repository-level pytest config.
addopts = --import-mode=importlib -p no:cacheprovider
norecursedirs = .* build dist node_modules python sgl-model-gateway sgl-router rust
# Do not add repository-level plugins here; this config must stay usable with a
# bare python3 + pytest install and must never trigger sglang dependency setup.
