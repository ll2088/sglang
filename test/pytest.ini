[pytest]
asyncio_mode = auto
# Collect the lightweight import smoke tests deterministically (no reliance on
# plugin-provided ordering) so a broken import chain is reported first.
testpaths = .
python_files = test_*.py
# Keep the smoke test independent of random ordering plugins: the import
# chain must be exercised in a fixed order so the first failure is stable.
addopts = -p no:randomly
# The import smoke test must fail fast instead of hanging on a broken import.
timeout = 60
