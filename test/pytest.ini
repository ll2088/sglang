[pytest]
# Scope collection to this directory and avoid loading repository-level
# plugins/options that would pull in sglang during environment setup.
# testpaths keeps collection inside test/ so the repository-root sglang
# package is never imported during setup; norecursedirs additionally skips
# build artifacts and vendored trees.
testpaths = .
addopts = --import-mode=importlib -p no:cacheprovider
norecursedirs = .* build dist node_modules python sgl-model-gateway sgl-router rust
