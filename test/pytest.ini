[pytest]
asyncio_mode = auto

# Keep collection scoped to the test tree so running `pytest` from the repo
# root resolves the same rootdir/collection set as `test/run_suite.py`.
testpaths = test

# Registered CI tests live under test/registered/ and are named test_*.py;
# benchmark files use bench_*.py and are executed by run_suite.py directly.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Declared so `pytest -q test` does not emit unknown-marker warnings.
markers =
    asyncio: mark a test as an asyncio coroutine test
    slow: mark a test as slow
    gpu: mark a test as requiring a GPU
    nightly: mark a test as nightly-only

# Avoid rootdir ambiguity when invoked from the repo root or from test/.
rootdir = .
