[pytest]
# Standalone pytest configuration for the stdlib-only Dockerfile permission
# checks. CI must invoke pytest with `-c test/dockerfile_permissions/pytest.ini`
# and `--rootdir test/dockerfile_permissions` so pytest never walks up to the
# repository root and loads a root-level pyproject.toml or conftest.py that
# would trigger a full sglang dependency install during environment setup.
#
# Keep this file free of third-party plugins and addopts that could pull in
# repository-level configuration.
rootdir = .
testpaths = test_dockerfile_permissions.py
python_files = test_dockerfile_permissions.py
python_classes =
python_functions = test_*
addopts = --import-mode=importlib -p no:cacheprovider
norecursedirs = .* build dist node_modules python sgl-model-gateway sgl-router rust
