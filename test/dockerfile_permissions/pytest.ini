[pytest]
# Standalone pytest configuration for the stdlib-only Dockerfile permission
# checks. CI must invoke this file explicitly:
#
#   python3 -m pytest -q -c test/dockerfile_permissions/pytest.ini \
#       test/dockerfile_permissions/
#
# rootdir is pinned to this directory so pytest never walks up to the
# repository root and loads a root-level conftest.py or pyproject.toml that
# could trigger a full sglang install during environment setup.
rootdir = .
testpaths = .
python_files = test_*.py
python_classes =
python_functions = test_*
addopts = --import-mode=importlib -p no:cacheprovider
norecursedirs = .* build dist node_modules python sgl-model-gateway sgl-router rust
