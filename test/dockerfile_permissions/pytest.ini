[pytest]
# Scope collection to the stdlib-only Dockerfile permission checks and avoid
# loading repository-level plugins/options that would pull in sglang during
# environment setup. rootdir is pinned explicitly to this directory so pytest
# does not walk up to the repository root and pick up a root-level pytest
# configuration (or a root-level conftest.py) that could trigger a full sglang
# dependency install during setup.
rootdir = .
testpaths = .
python_files = test_*.py
python_classes =
python_functions = test_*
# Keep addopts minimal: no third-party plugins, no cache provider.
addopts = --import-mode=importlib -p no:cacheprovider
norecursedirs = .* build dist node_modules python sgl-model-gateway sgl-router rust
