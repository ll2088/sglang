[pytest]
# Isolated pytest configuration for the stdlib-only Dockerfile permission
# checks. CI must invoke pytest with
#   -c test/dockerfile_permissions/pytest.ini --rootdir test/dockerfile_permissions
# so the repository-root pytest configuration (and its sglang dependency
# setup) is never loaded.
rootdir = .
testpaths = test_dockerfile_permissions.py
python_files = test_dockerfile_permissions.py
python_classes =
python_functions = test_*
addopts = --import-mode=importlib -p no:cacheprovider
norecursedirs = .* build dist node_modules python sgl-model-gateway sgl-router rust
