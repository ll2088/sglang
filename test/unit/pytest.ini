[pytest]
asyncio_mode = auto
# Self-contained config for the run_suite unit tests. These tests stub out
# sglang.test.ci.* in conftest.py, so they must be runnable with only pytest
# installed (no full sglang dependency set).
#
# Keep this file free of options that require plugins beyond pytest itself:
# the CI verification job for these tests installs only pytest, so any
# missing plugin would turn into a collection error instead of a test result.
testpaths = .
rootdir = .
# conftest.py must be imported before any test module so the sglang.test.ci
# stubs exist when run_suite is imported at module scope.
addopts = -p no:cacheprovider
