[workspace]
resolver = "2"
members = [
    "rust/sglang-grpc",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
async-stream = "0.3"
bytes = "1"
prost = "0.14"
prost-types = "0.14"
pyo3 = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-build = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
