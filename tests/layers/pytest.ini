; Minimal pytest configuration for the stdlib-only Engram MXFP4 tests.
;
; CI environment preparation can fail while installing the full sglang
; dependency tree (torch, triton, py-spy, pybase64, pydantic, quack-kernels,
; ...). The MXFP4 layout module and its self-check are stdlib-only, so these
; tests must be runnable with only pytest installed and without resolving the
; sglang package itself.
;
; Run from the repository root with:
;
;   PYTHONPATH=python python -m pytest -q --confcutdir=tests/layers \
;       -p no:cacheprovider tests/layers/test_engram_mxfp4_selfcheck.py
;
; The --confcutdir flag keeps the repository root conftest.py (which may
; import sglang) out of collection, so no sglang/torch/triton import is
; triggered. This file documents the intended invocation; it is not loaded
; automatically unless pytest is pointed at this directory.
[pytest]
minversion = 7.0
addopts = -p no:cacheprovider
norecursedirs = .git .tox dist build *.egg
