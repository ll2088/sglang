[pytest]
# Minimal config so tests/kernels/test_dsa_topk_bf16.py can run without the
# full sglang dependency tree.  Only pytest and numpy are required.
minversion = 7.0
testpaths = .
python_files = test_*.py
addopts = -q
markers =
    requires_sglang: test needs the sglang package to be importable
