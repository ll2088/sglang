[pytest]
# Standalone config so this directory can be collected without the repo-wide
# sglang/torch dependency chain.  Run with:
#   python -m pytest -q -c tests/kernels/pytest.ini tests/kernels/test_dsa_topk_bf16.py
addopts = -p no:cacheprovider
markers =
    requires_sglang: test needs the sglang package to be importable
