[pytest]
# Keep the BF16 capability tests independent of the repo-wide pytest config,
# which assumes the full sglang runtime is importable.
#
# Run with:
#   python -m pytest -q -c tests/kernels/pytest.ini tests/kernels/test_dsa_topk_bf16.py
#
# Do not add plugins that require sglang or torch here.
addopts = -p no:cacheprovider
filterwarnings =
    error::DeprecationWarning:dsa_bf16_capability
