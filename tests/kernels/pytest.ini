[pytest]
# Minimal-dependency test configuration for tests/kernels.
# These tests must be collectable without installing the full sglang runtime.
minversion = 7.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    requires_sglang: test needs the sglang package to be importable
