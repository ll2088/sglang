[pytest]
# Minimal, self-contained configuration for the DSA top-k capability tests.
# These tests must run with only pytest installed; they never import torch,
# CUDA or sglang.  Run with:
#   python -m pytest -q -c tests/kernels/pytest.ini tests/kernels/test_dsa_topk_bf16.py
addopts = -p no:randomly
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = .
