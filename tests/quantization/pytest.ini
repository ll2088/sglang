#
# Self-contained pytest configuration for the activation-fallback suite.
#
# This suite must run without importing the ``sglang`` package (no GPU, no
# compiled kernels, no full dependency set). ``rootdir`` is pinned here and
# ``--import-mode=importlib`` is used so that collection never triggers an
# implicit ``import sglang`` via the repository root being on ``sys.path``.
#
# CI MUST install only ``tests/quantization/requirements.txt`` (with
# ``--no-deps`` passed on the pip command line) and MUST NOT run
# ``pip install -e python`` for this suite.

[pytest]
rootdir = .
testpaths = .
importmode = importlib
addopts = -ra
norecursedirs = .git .github build dist *.egg-info
