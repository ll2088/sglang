#
# Self-contained pytest configuration for tests/quantization.
#
# The activation-fallback suite (test_activation_fallback.py) loads the module
# under test directly from its file path and only uses the standard library
# plus pytest. It must NOT require a full ``pip install -e python`` of sglang
# (no GPU, no compiled kernels, no third-party runtime deps).
#
# CI jobs that run this directory should install only tests/quantization/
# requirements.txt (pytest) and invoke pytest with this directory as the
# rootdir, e.g.:
#
#     python -m pytest -q tests/quantization/test_activation_fallback.py
#
# so that this file is picked up instead of the repository-wide pytest.ini.
[pytest]
minversion = 7.0
addopts = -ra
# Keep collection scoped to this directory so the suite never imports sglang
# or any GPU/kernel dependency during collection.
testpaths = .
# Do not require the sglang package to be importable.
# (The suite loads the module under test from its file path.)
