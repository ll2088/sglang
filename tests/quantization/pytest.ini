#
# Minimal pytest config for the activation-fallback suite.
#
# CI must invoke pytest with ``-c tests/quantization/pytest.ini`` so that
# pytest does not pick up the repository-root pyproject.toml / setup.py and
# trigger the full sglang dependency resolution during environment
# preparation. The suite only needs pytest.

[pytest]
rootdir = .
testpaths = .
addopts = -p no:cacheprovider
importmode = importlib
norecursedirs = .git .tox .venv build dist node_modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*
