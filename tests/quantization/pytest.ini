#
# Directory-local pytest configuration for the self-contained
# activation-fallback suite. Pinning rootdir/testpaths here keeps the
# repository-root pytest configuration from being picked up, which would
# otherwise pull in the full sglang runtime dependency set.
#
# Run with:
#   python -m pytest -q -c tests/quantization/pytest.ini tests/quantization

[pytest]
rootdir = .
testpaths = .
addopts = -ra
