#
# Directory-local pytest configuration for the self-contained
# activation-fallback suite.
#
# This file pins rootdir/testpaths to tests/quantization so the repository-root
# pytest configuration is not picked up. That matters because the root config
# may import sglang (or its plugins), which would defeat the purpose of this
# suite: it must run with only pytest installed, no GPU, no compiled kernels,
# and no `pip install -e python`.
#
# Run with:
#   python -m pytest -q -c tests/quantization/pytest.ini tests/quantization

[pytest]
testpaths = .
rootdir = .
addopts = -p no:cacheprovider
