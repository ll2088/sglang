#
# Directory-local pytest configuration for the activation-fallback suite.
#
# This suite is deliberately self-contained: it loads the module under test
# directly from its file path and only uses the standard library plus pytest.
# It must NOT require a full ``pip install -e python`` of sglang (no GPU, no
# compiled kernels, no third-party runtime deps).
#
# Pinning rootdir/testpaths here keeps the repository-root pytest
# configuration from being picked up, which would otherwise pull in the full
# sglang runtime dependency set and fail on GPU-less runners.
#
# Run with:
#   python -m pytest -q -c tests/quantization/pytest.ini tests/quantization

[pytest]
rootdir = .
testpaths = .
addopts = -ra
