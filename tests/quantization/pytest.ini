[pytest]
# Pin rootdir/testpaths to this directory so the suite does not depend on the
# repository-root pytest configuration. This suite is intentionally
# self-contained: it must run without installing the sglang package (no GPU,
# no compiled kernels, no third-party runtime deps).
#
# CI jobs that run this directory should install only
# tests/quantization/requirements.txt (pytest) and must NOT run
# `pip install -e python`, which pulls the full sglang runtime dependency set
# and fails on GPU-less runners.
rootdir = .
testpaths = .
