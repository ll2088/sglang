[pytest]
# Self-contained test configuration for tests/quantization.
#
# These tests intentionally avoid importing the ``sglang`` package so they can
# run in a minimal environment (no GPU, no compiled kernels, no full dependency
# set). The module under test is loaded directly from its file path and only
# uses the standard library.
#
# Do NOT add ``--import-mode=importlib`` or rootdir-based collection that would
# pull in the repository-level conftest.py, which imports sglang and would
# re-introduce the full dependency install requirement.
addopts = -ra
norecursedirs = .git .tox .eggs build dist node_modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*
