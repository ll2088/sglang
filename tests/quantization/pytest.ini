# Pin rootdir/testpaths to this directory so the activation-fallback suite
# does not pick up the repository-root pytest configuration (which may import
# sglang or require the full runtime dependency set).
#
# Run with:
#   python -m pytest -q -c tests/quantization/pytest.ini tests/quantization
[pytest]
rootdir = .
testpaths = .
addopts = -ra
