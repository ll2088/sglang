#
# Minimal pytest configuration for the activation-fallback suite.
#
# This suite must run with only pytest installed: it must never resolve the
# full sglang dependency set (py-spy, pybase64, pydantic, quack-kernels, ...).
# The module under test is loaded from its source file by conftest.py, so no
# sglang import is required.
#
# CI must invoke pytest with ``-c tests/quantization/pytest.ini`` so that the
# repository-root pyproject.toml / setup.py is not consulted and no editable
# install of the sglang package is triggered.

[pytest]
# Keep the rootdir pinned to this directory so a parent conftest.py or
# pyproject.toml is not collected, which would re-introduce the full sglang
# dependency resolution during collection.
rootdir = .
testpaths = .

# Only collect the activation-fallback suite from this directory.
python_files = test_activation_fallback.py
python_classes = Test*
python_functions = test_*

# Do not add the repository root to sys.path; conftest.py loads the module
# under test directly from its source file.
addopts = -p no:cacheprovider

# Keep output deterministic and quiet enough for CI logs.
log_cli = false
log_level = WARNING
