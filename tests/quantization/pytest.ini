#
# Directory-local pytest configuration for the activation-fallback suite.
#
# This file pins rootdir/testpaths to tests/quantization so that pytest does
# NOT walk up to the repository root and pick up the root pyproject.toml /
# setup.cfg / conftest.py. Picking those up would trigger plugin loading and
# (in some CI setups) an implicit `pip install -e python` of the sglang main
# package, which is exactly what this suite must avoid: it is intentionally
# self-contained and only needs pytest.
#
# Run with:
#   python -m pytest -q -c tests/quantization/pytest.ini tests/quantization

[pytest]
# Pin rootdir to this directory so the repository-root configuration is not
# consulted. `testpaths` keeps bare `pytest` invocations scoped here too.
rootdir = .
testpaths = .

# Do not auto-load third-party plugins. The suite only uses the standard
# library plus pytest; disabling autoload avoids importing plugins that may
# pull in the sglang runtime dependency set.
addopts = -p no:cacheprovider

# Keep collection deterministic and independent of the repository root.
norecursedirs = .git .tox .venv venv build dist *.egg-info
