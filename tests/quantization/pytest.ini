#
# Self-contained pytest configuration for the activation-fallback suite.
#
# This suite must run with only pytest installed: the module under test
# (activation_fallback.py) uses the standard library only, and conftest.py
# loads it directly from its source file without importing the sglang
# package. CI MUST NOT run ``pip install -e python`` for this suite; doing so
# resolves the full sglang dependency set (py-spy, pybase64, pydantic,
# python-multipart, pyzmq, quack-kernels, regex, ...) and fails before any
# test executes.
#
# Correct invocation:
#
#     pip install --no-deps -r tests/quantization/requirements.txt
#     python -m pytest -q -c tests/quantization/pytest.ini \
#         tests/quantization/test_activation_fallback.py
#
# The suite is also runnable without installing anything at all, as long as
# pytest is already available on the interpreter.

[pytest]
# Keep collection rooted at this directory so a parent pyproject.toml /
# conftest.py cannot pull the repository root onto sys.path and trigger an
# ``import sglang`` during collection.
rootdir = .

# importlib import mode avoids inserting the test directory (and, via a
# parent conftest, the repository root) into sys.path, which is what would
# otherwise let ``import sglang`` resolve the top-level package.
addopts = --import-mode=importlib -p no:cacheprovider

# Only collect this suite's tests; never walk up into the repository.
testpaths = test_activation_fallback.py

# Keep output deterministic and quiet enough for CI logs.
console_output_style = count
