#
# Minimal pytest configuration for the activation-fallback suite.
#
# This directory is intentionally self-contained: it must run without a full
# ``pip install -e python`` of sglang. CI jobs that target this directory
# should install only ``tests/quantization/requirements.txt`` and then run
# ``python -m pytest tests/quantization`` from the repository root.
#
# The settings below keep the suite hermetic (no third-party plugins required)
# and make failures easier to diagnose in CI logs.
[pytest]
minversion = 7.0
addopts = -ra --strict-markers --strict-config
norecursedirs = .git .tox build dist node_modules
