#
# Directory-local pytest configuration for the self-contained
# activation-fallback suite. Pinning rootdir/testpaths here keeps the
# repository-root pytest configuration (and its full sglang runtime
# dependency set) from being picked up when this suite is run in a minimal
# environment.
[pytest]
rootdir = .
testpaths = .
addopts = -ra
