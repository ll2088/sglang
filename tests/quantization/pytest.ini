#
# Minimal pytest configuration for the activation-fallback suite.
#
# CI must invoke pytest with this file explicitly:
#   python -m pytest -q -c tests/quantization/pytest.ini \
#       tests/quantization/test_activation_fallback.py
#
# Pinning rootdir/testpaths here keeps pytest from walking up to the
# repository root, where pyproject.toml / setup.py would trigger the full
# sglang dependency resolution during environment preparation.

[pytest]
rootdir = .
testpaths = .
addopts = -p no:cacheprovider
