#
# Minimal pytest config for the activation-fallback suite.
#
# CI must invoke pytest with ``-c tests/quantization/pytest.ini`` so pytest
# does not pick up the repository-root pyproject.toml / setup.py, which would
# trigger the full sglang dependency resolution during environment
# preparation. The suite only needs pytest.

[pytest]
rootdir = .
testpaths = .
