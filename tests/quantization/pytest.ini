#
# Minimal pytest configuration for the activation-fallback suite.
#
# The suite must run with only pytest installed. Without an explicit config,
# pytest walks up from the test directory and picks up the repository-root
# pyproject.toml / setup.py, which resolves the full sglang dependency set
# during environment preparation. Pinning rootdir and testpaths here keeps
# collection inside tests/quantization.

[pytest]
rootdir = .
testpaths = .
addopts = -p no:cacheprovider
norecursedirs = .git __pycache__ .tox .venv venv build dist
