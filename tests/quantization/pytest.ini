#
# Self-contained pytest configuration for the activation-fallback suite.
#
# This file pins ``rootdir`` and ``--import-mode=importlib`` so that pytest
# never walks up to the repository root, never picks up the top-level
# pyproject.toml / setup.cfg, and never triggers an implicit ``import sglang``
# during collection. CI MUST load it explicitly:
#
#     python -m pytest -q -c tests/quantization/pytest.ini \
#         tests/quantization/test_activation_fallback.py
#
# The suite is loaded from source files by ``tests/quantization/conftest.py``
# using ``importlib`` and only needs pytest installed.

[pytest]
rootdir = .
testpaths = .
addopts = --import-mode=importlib -p no:cacheprovider
norecursedirs = .* build dist node_modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*
