# Self-contained pytest configuration for the activation-fallback suite.
#
# This file exists so CI can run the suite with only pytest installed:
#
#     python -m pytest -q -c tests/quantization/pytest.ini \
#         tests/quantization/test_activation_fallback.py
#
# Passing ``-c tests/quantization/pytest.ini`` pins the rootdir to this
# directory, which keeps pytest from walking up to the repository root and
# picking up a pyproject.toml / setup.cfg that would trigger the full sglang
# dependency resolution during collection.
#
# ``--import-mode=importlib`` avoids inserting the test directory into
# ``sys.path`` (which could make a stray ``import sglang`` resolve the
# top-level package). The module under test is loaded from its source file by
# ``conftest.py`` instead.

[pytest]
rootdir = .
testpaths = .
importmode = importlib
addopts = -p no:cacheprovider

# The suite is hermetic: it must not import the sglang package (whose
# __init__ pulls in py-spy, pybase64, pydantic, pyzmq, quack-kernels, ...).
# Any such import is caught by the guards in conftest.py and by the
# self-containment tests in test_activation_fallback.py.
