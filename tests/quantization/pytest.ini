#
# Minimal pytest config for the activation-fallback suite.
#
# The suite is loaded from file paths via conftest.py and only needs pytest.
# Pinning rootdir/testpaths here prevents pytest from walking up to the
# repository root and picking up pyproject.toml / setup.cfg, which would
# trigger the full sglang dependency resolution during environment
# preparation.

[pytest]
rootdir = .
testpaths = .
addopts = -p no:cacheprovider
