#
# Minimal pytest configuration for the activation-fallback suite.
#
# This suite must run with only ``pytest`` installed. Without an explicit
# config, pytest would pick up the repository-root pyproject.toml / setup.py
# and could trigger the full sglang dependency resolution during environment
# preparation. CI must invoke pytest with ``-c tests/quantization/pytest.ini``.

[pytest]
rootdir = .
testpaths = .
addopts = -p no:cacheprovider
