# Self-contained pytest configuration for tests/quantization.
#
# This directory must be runnable without installing the sglang package:
# the activation-fallback suite loads the module under test directly from
# its file path and only needs pytest. CI jobs that run this directory
# should install tests/quantization/requirements.txt and must NOT run
# `pip install -e python` (which pulls the full sglang runtime dependency
# set and fails on GPU-less runners).
#
# Pinning rootdir/testpaths here keeps the suite independent of the
# repository-root pytest configuration and of any installed sglang package.
[pytest]
rootdir = .
testpaths = .
addopts = -p no:randomly
norecursedirs = __pycache__ .git
