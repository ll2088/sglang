# Self-contained pytest configuration for the activation-fallback suite.
#
# This file pins rootdir and the import mode so that pytest never walks up to
# the repository root, never picks up a parent conftest.py, and never triggers
# an implicit ``import sglang`` during collection. CI only needs pytest
# installed (see requirements.txt) to run this suite.
#
# Correct invocation:
#
#     pip install --no-deps -r tests/quantization/requirements.txt
#     python -m pytest -q -c tests/quantization/pytest.ini \
#         tests/quantization/test_activation_fallback.py

[pytest]
rootdir = .
testpaths = .
importmode = importlib
addopts = -p no:cacheprovider
norecursedirs = .git .tox .venv build dist
