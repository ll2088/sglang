#
# Directory-local pytest configuration for the activation-fallback suite.
#
# This suite is intentionally self-contained: it must run without installing
# the ``sglang`` package (no GPU, no compiled kernels, no third-party runtime
# deps). Pinning rootdir/testpaths to this directory prevents pytest from
# walking up to the repository root, picking up the root pytest configuration
# and importing ``sglang`` (which would trigger a full main-package install in
# CI environment preparation).
#
# Run with:
#   python -m pytest -q -c tests/quantization/pytest.ini tests/quantization

[pytest]
testpaths = .
addopts = -p no:randomly -p no:cacheprovider
