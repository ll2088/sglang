#
# Minimal pytest configuration for the activation-fallback suite.
#
# CI must invoke pytest with an explicit config so pytest does not walk up to
# the repository-root pyproject.toml / setup.py, which would resolve the full
# sglang dependency set during environment preparation:
#
#   python -m pytest -q -c tests/quantization/pytest.ini \
#       tests/quantization/test_activation_fallback.py

[pytest]
rootdir = .
testpaths = .
addopts = -p no:cacheprovider
