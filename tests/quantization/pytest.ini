# Directory-local pytest configuration for tests/quantization.
#
# This suite is intentionally self-contained: it must run without installing
# the ``sglang`` package (no GPU, no compiled kernels, no third-party runtime
# deps). Pinning rootdir/testpaths here keeps the repository-root pytest
# configuration (and any of its addopts/plugins) from being picked up, which
# would otherwise trigger imports of the full sglang runtime.
#
# Run with:
#   python -m pytest -q -c tests/quantization/pytest.ini tests/quantization

[pytest]
rootdir = .
testpaths = .

# Do not inherit addopts from the repository root configuration.
addopts =

# Keep collection local to this directory.
norecursedirs = .git __pycache__ *.egg-info build dist
