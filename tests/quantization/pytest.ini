#
# Minimal pytest config for the activation-fallback suite.
#
# CI must invoke pytest with an explicit config so pytest does not pick up the
# repository-root pyproject.toml / setup.py, which would trigger the full
# sglang dependency resolution during environment preparation:
#
#   python -m pytest -q -c tests/quantization/pytest.ini \
#       tests/quantization/test_activation_fallback.py
#
# The suite only needs pytest; see requirements.txt.

[pytest]
rootdir = .
testpaths = .
addopts = -ra
