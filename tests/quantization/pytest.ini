#
# Minimal pytest configuration for the activation-fallback suite.
#
# The suite must run with only pytest installed. Pinning rootdir and testpaths
# here prevents pytest from walking up to the repository root and resolving the
# full sglang dependency set during environment preparation.

[pytest]
rootdir = .
testpaths = .
addopts = -p no:cacheprovider
norecursedirs = .git .github build dist node_modules python
