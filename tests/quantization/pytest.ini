#
# Minimal pytest configuration for the activation-fallback suite.
#
# This suite must run with only pytest installed. Invoke it explicitly with
# this config so pytest does not pick up the repository-root pyproject.toml /
# setup.py, which would trigger the full sglang dependency resolution during
# environment preparation:
#
#   pip install -r tests/quantization/requirements.txt
#   python -m pytest -q -c tests/quantization/pytest.ini \
#       tests/quantization/test_activation_fallback.py
#
# Do NOT run ``pip install -e python`` for this suite.

[pytest]
rootdir = .
testpaths = .
addopts = -p no:cacheprovider
