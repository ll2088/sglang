# Self-contained pytest configuration for tests/quantization.
#
# This directory is intentionally independent of the full sglang runtime
# dependency set: the activation-fallback suite loads the module under test
# directly from its file path and only needs pytest. CI jobs that run this
# directory should install only tests/quantization/requirements.txt and must
# NOT run `pip install -e python`.
[pytest]
minversion = 7.0
addopts = -ra
# Keep the rootdir at tests/quantization so that conftest.py here is the only
# conftest that applies and no sglang-level conftest is imported.
rootdir = .
testpaths = .
# Do not require the sglang package to be importable.
# (The suite loads the module under test from its file path.)
