#
# Self-contained pytest configuration for the activation-fallback suite.
#
# This suite must run without importing the ``sglang`` package: the module
# under test (activation_fallback.py) only uses the standard library and is
# loaded from its file path by ``conftest.py``. Pinning ``rootdir`` and
# ``--import-mode=importlib`` here keeps collection from walking up into the
# repository root, where a parent ``conftest.py`` / ``pyproject.toml`` could
# trigger the full sglang dependency resolution.
#
# Run with:
#
#     python -m pytest -q -c tests/quantization/pytest.ini \
#         tests/quantization/test_activation_fallback.py

[pytest]
rootdir = .
testpaths = .
import-mode = importlib
addopts = -p no:cacheprovider
