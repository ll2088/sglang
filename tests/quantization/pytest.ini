#
# Minimal pytest configuration for the activation-fallback suite.
#
# This file exists so CI can run the suite with an explicit config and avoid
# pytest picking up the repository-root pyproject.toml / setup.py, which would
# trigger the full sglang dependency resolution during environment
# preparation.
#
# Usage:
#   pip install -r tests/quantization/requirements.txt
#   python -m pytest -q -c tests/quantization/pytest.ini \
#       tests/quantization/test_activation_fallback.py

[pytest]
rootdir = .
testpaths = .
addopts = -p no:cacheprovider
