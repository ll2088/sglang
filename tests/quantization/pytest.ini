#
# Minimal pytest configuration for the activation-fallback suite.
#
# This suite must run with only pytest installed: it loads the module under
# test directly from its source file (see conftest.py) and never imports the
# ``sglang`` package. Keeping a dedicated ini file lets CI invoke
#
#   python -m pytest -q -c tests/quantization/pytest.ini \
#       tests/quantization/test_activation_fallback.py
#
# without picking up the repository-wide pytest configuration (which may add
# plugins or import paths that resolve the full sglang dependency set).

[pytest]
minversion = 7.0
# Do not add the repository root or the ``python/`` directory to sys.path:
# either would let ``import sglang`` resolve the top-level package and pull in
# the full dependency set during collection.
addopts = -p no:cacheprovider
# Keep collection confined to this directory so a parent conftest.py cannot
# drag in sglang imports.
testpaths = tests/quantization
# No third-party plugins are required; disable autoloading so an installed
# plugin cannot re-introduce a sglang import during collection.
required_plugins =
