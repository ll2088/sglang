#
# Minimal pytest configuration for the activation-fallback suite.
#
# This suite must run with only pytest installed (no sglang, no GPU, no
# compiled kernels). The module under test is loaded directly from its source
# file by conftest.py, so no package installation is required.
#
# CI must invoke this suite as:
#   python -m pytest -q -c tests/quantization/pytest.ini tests/quantization/test_activation_fallback.py
# and must NOT run ``pip install -e python`` for it.

[pytest]
# Keep collection scoped to this directory so a parent conftest.py or the
# repository root pyproject.toml cannot pull in the full sglang dependency set.
testpaths = tests/quantization
# Do not add the repository root to sys.path; conftest.py loads the module
# under test from its file path instead.
addopts = -p no:cacheprovider
# Fail fast on import errors so CI reports a clear cause instead of a
# confusing dependency-resolution failure.
