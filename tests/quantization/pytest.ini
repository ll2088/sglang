# Self-contained pytest configuration for the activation-fallback suite.
#
# This directory must be runnable without installing the full sglang runtime
# dependency set (no GPU, no compiled kernels, no third-party deps). CI jobs
# that run this directory should install only tests/quantization/requirements.txt
# (pytest) and invoke pytest with `-c tests/quantization/pytest.ini` so that
# this rootdir is used instead of the repository-wide configuration.
[pytest]
rootdir = .
testpaths = test_activation_fallback.py
addopts = -ra
filterwarnings =
    ignore::RuntimeWarning
