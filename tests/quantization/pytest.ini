# Self-contained pytest configuration for the activation-fallback suite.
#
# This file pins rootdir and importmode so the suite runs identically in CI
# regardless of the surrounding repository layout, and so that no implicit
# ``sglang`` import is triggered by pytest's collection machinery.
#
# CI should invoke this suite as:
#
#     pip install -r tests/quantization/requirements.txt
#     python -m pytest -q -c tests/quantization/pytest.ini \
#         tests/quantization/test_activation_fallback.py
#
# Do NOT run ``pip install -e python`` for this suite: that pulls in the full
# sglang dependency set and is what caused the previous environment failure.

[pytest]
# Keep the rootdir anchored at this directory so relative paths in conftest
# resolve the same way locally and in CI.
rootdir = .
# ``importmode=importlib`` avoids inserting the repository root onto
# sys.path, which would otherwise let pytest pick up the top-level
# ``python/`` package tree and trigger the full sglang import chain.
addopts = --import-mode=importlib
# Only collect tests under this directory; nothing outside it should be
# pulled in by an accidental rootdir walk.
testpaths = .
# Keep output deterministic for the stability job.
console_output_style = classic
