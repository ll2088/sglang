#
# Self-contained pytest configuration for the activation-fallback suite.
#
# This file pins rootdir and import mode so that pytest never walks up into
# the repository root and picks up a top-level conftest.py / pyproject.toml
# that would import the ``sglang`` package (and therefore resolve its full
# dependency set: py-spy, pybase64, pydantic, python-multipart, pyzmq,
# quack-kernels, regex, ...). The suite is designed to run with only pytest
# installed; see tests/quantization/requirements.txt.
#
# Correct invocation:
#
#     pip install -r tests/quantization/requirements.txt
#     python -m pytest -q -c tests/quantization/pytest.ini \
#         tests/quantization/test_activation_fallback.py

[pytest]
# Keep the rootdir anchored at this directory so no parent conftest.py is
# collected and no implicit ``sglang`` import is triggered.
rootdir = .

# importlib import mode avoids inserting the repository root on sys.path,
# which is what previously caused ``import sglang`` to be attempted during
# collection.
addopts = --import-mode=importlib

# Only collect tests from this directory.
testpaths = .

# Do not recurse into the rest of the repository.
norecursedirs = *
