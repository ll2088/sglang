#
# Minimal pytest configuration for the activation-fallback suite.
#
# This file exists so CI can run the suite with only pytest installed:
#
#   pip install -r tests/quantization/requirements.txt
#   python -m pytest -q -c tests/quantization/pytest.ini \
#       tests/quantization/test_activation_fallback.py
#
# Without ``-c tests/quantization/pytest.ini`` pytest would discover the
# repository-root ``pyproject.toml`` / ``setup.py`` and resolve the full
# sglang dependency set during environment preparation.

[pytest]
rootdir = .
testpaths = .
addopts = -p no:cacheprovider
