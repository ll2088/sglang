# Self-contained pytest configuration for the activation-fallback suite.
#
# This suite must run with only pytest installed. It must NOT import the
# ``sglang`` package, because doing so resolves the full sglang dependency set
# (py-spy, pybase64, pydantic, quack-kernels, ...) and fails in minimal CI
# environments. The module under test is loaded from its source file by
# ``conftest.py``.
#
# Run with:
#
#     python -m pytest -q -c tests/quantization/pytest.ini \
#         tests/quantization/test_activation_fallback.py
#
# Do NOT run ``pip install -e python`` for this suite; install only
# ``tests/quantization/requirements.txt`` (pytest).

[pytest]
# Keep collection rooted at this directory so a parent conftest.py or
# pyproject.toml cannot pull in the full package during collection.
rootdir = .
# Do not add the repository root to sys.path; the suite loads the module under
# test from its file path instead.
addopts = -p no:cacheprovider
# Only collect the self-contained suite in this directory.
testpaths = test_activation_fallback.py
