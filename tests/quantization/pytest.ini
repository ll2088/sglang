# Self-contained pytest config for the activation-fallback suite.
#
# This suite must run without installing the full sglang runtime dependency
# set (no GPU, no compiled kernels). It therefore does NOT rely on the
# repository root pytest.ini / pyproject.toml, which may pull in plugins or
# import paths that require the full install.
#
# Run with:
#   python -m pytest -q -c tests/quantization/pytest.ini tests/quantization
[pytest]
minversion = 7.0
addopts = -ra
# Keep collection scoped to this directory so the root conftest.py (which may
# import sglang) is never loaded.
testpaths = .
# Do not require any third-party plugins beyond pytest itself.
required_plugins =
