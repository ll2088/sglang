# Self-contained pytest configuration for the activation-fallback suite.
#
# This file pins rootdir to tests/quantization and forces importlib import
# mode so that collection never walks up to the repository root and never
# triggers an implicit ``import sglang`` (which would resolve the full
# dependency set).
#
# Run with:
#
#     python -m pytest -q -c tests/quantization/pytest.ini \
#         tests/quantization/test_activation_fallback.py

[pytest]
rootdir = .
importmode = importlib
addopts = -p no:cacheprovider
norecursedirs = *
testpaths = test_activation_fallback.py
