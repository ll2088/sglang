# Self-contained pytest configuration for the activation-fallback suite.
#
# This file exists so CI can run the suite with only pytest installed:
#
#     python -m pytest -q -c tests/quantization/pytest.ini \
#         tests/quantization/test_activation_fallback.py
#
# It deliberately does NOT inherit the repository root pytest.ini, which
# imports the full sglang package (and therefore its heavy dependencies).

[pytest]
# Keep the test root inside this directory so no repository-level conftest
# or plugin is auto-loaded.
testpaths = .
# Do not add the repository root to sys.path here; conftest.py loads the
# module under test directly from its file path instead.
addopts = -p no:cacheprovider
# Only collect tests from this directory.
norecursedirs = .git __pycache__
